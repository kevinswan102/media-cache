name: AUTOMATION dependency security audit

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-dependency-security-audit
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            audit/automation/requirements.txt
            audit/automation/requirements-kalshi.txt
      - name: Audit mirrored Python runtime dependencies
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r audit/automation/requirements.txt
          python -m pip_audit -r audit/automation/requirements-kalshi.txt

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            audit/automation/package-lock.json
            audit/automation/cloudflare-worker/package-lock.json
      - name: Audit mirrored site tooling dependencies
        working-directory: audit/automation
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit mirrored Cloudflare Worker dependencies
        working-directory: audit/automation/cloudflare-worker
        run: npm audit --omit=dev --audit-level=moderate
